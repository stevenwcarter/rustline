[package]
name = "rustline"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "rustline"
path = "src/main.rs"

[dependencies]
rustline-core = { path = "../rustline-core" }
rustline-wasm = { path = "../rustline-wasm" }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libc = "0.2"
gethostname = "1"
if-addrs = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry", "fmt", "ansi"] }
# Daily log rotation that re-evaluates its target on every write. The
# hand-rolled size rotation it replaces decided once at process start, so the
# long-lived `daemon run` process kept appending to an unlinked inode after the
# second rotation and lost every diagnostic. Used as a blocking `MakeWriter`,
# NOT via `non_blocking`: that returns a `WorkerGuard` which must outlive the
# subscriber, and short-lived `render` processes would drop it and lose logs.
tracing-appender = "0.2.5"
anyhow = "1"
toml = "0.9"
toml_edit = "0.25"
# Already the workspace's serde (used by rustline-core/rustline-abi/
# rustline-wasm) — adds no new node to the dep graph. Needed directly here for
# the daemon wire protocol's Serialize/Deserialize derives (W48).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# GitHub release download for `plugin install` (W38): rustls only (the `tls`
# feature = rustls in ureq 2.x — never native-tls/openssl), `json` for the
# release-API response. A dedicated downloader (this, not rustline-wasm's
# String-body Fetcher) because it must follow GitHub's redirect to the binary
# asset and return raw bytes.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
comfy-table = { version = "7", optional = true }
# Interactive widget editor (`rustline widget edit`). Default features pull
# `ratatui-crossterm`, which re-exports crossterm as `ratatui::crossterm` — so
# crossterm is not a separate direct dependency. Deliberately NOT behind a
# cargo feature (unlike `bench`): `init` writes a `prefix + W` tmux binding
# unconditionally, so the subcommand it points at must always exist.
ratatui = "0.30"
unicode-width = "0.2.2"

[features]
# Opt-in positive end-to-end test that renders a real plugin through the bin
# (register_plugins -> WasmWidget -> guest). Needs `just build-weather`; gated
# so a plain `cargo test` stays hermetic.
wasm-e2e = []
# Opt-in `rustline bench` subcommand + its report deps. Off by default: the
# shipping binary and its dep graph are unchanged.
bench = ["dep:comfy-table"]

[dev-dependencies]
tempfile = "3"
